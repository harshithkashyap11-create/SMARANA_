# Requires externally managed PostgreSQL, Redis, private S3, SMTP and HTTPS ingress.
name: smarana-production
x-backend: &backend
  build: ./backend
  env_file: .env.production
  restart: unless-stopped
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.prod
  volumes:
    - staticfiles:/app/staticfiles
    - ./shared:/shared:ro
services:
  migrate:
    <<: *backend
    restart: "no"
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput"
  backend:
    <<: *backend
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 90 --access-logfile - --error-logfile -
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/api/v1/health/', headers={'Host': __import__('os').environ['DJANGO_ALLOWED_HOSTS'].split(',')[0]}), timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
  celery:
    <<: *backend
    command: celery -A config worker --loglevel=info
    depends_on:
      migrate:
        condition: service_completed_successfully
  celery-beat:
    <<: *backend
    command: celery -A config beat --loglevel=info --schedule /tmp/celerybeat-schedule
    depends_on:
      migrate:
        condition: service_completed_successfully
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - staticfiles:/srv/static:ro
    depends_on:
      backend:
        condition: service_started
volumes:
  staticfiles:
